perturbation_node:
  ros__parameters:
    # Главный переключатель
    enabled: true

    # 1. Гауссов шум на команды (нулевое среднее, не накапливается)
    linear_noise_std: 0.1      # м/с
    angular_noise_std: 0.2     # рад/с

    # 2. Продольное проскальзывание (bias, накапливается)
    #    0.0 = сухой асфальт, 0.3 = снег, 0.5 = лёд
    slip_ratio: 0.3
    slip_threshold: 0.01        # м/с, ниже этого проскальзывание не работает

    # 3. Боковой снос через угловое возмущение (накапливается)
    lateral_slip_gain: 0.5      # 0.0 = нет сноса, 0.1-0.3 = снег/лёд
    lateral_slip_frequency: 2.0 # Гц, частота "виляния"

    # 4. Кочки (пуассоновский процесс)
    bump_rate: 1.0              # событий в секунду
    bump_duration: 0.001          # секунд
    bump_magnitude: 0.1         # амплитуда (м/с для linear, рад/с для angular)
